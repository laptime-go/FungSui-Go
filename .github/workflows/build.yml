name: Build FungSui-Go AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install deps
        run: |
          npm install
          npm install expo-sensors || true

      - name: Patch app.json safely
        run: |
          node -e "
          const fs=require('fs');
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          j.expo=j.expo||{};
          j.expo.name='風水佬Go';
          j.expo.slug='fungsui-go';
          j.expo.version='1.0.0';
          j.expo.orientation=j.expo.orientation||'portrait';
          j.expo.ios=j.expo.ios||{};
          j.expo.ios.bundleIdentifier='com.laptimego.fungsui';
          j.expo.android=j.expo.android||{};
          j.expo.android.package='com.laptimego.fungsui';
          j.expo.android.compileSdkVersion=36;
          j.expo.android.targetSdkVersion=36;
          j.expo.android.minSdkVersion=24;
          j.expo.android.versionCode=1;
          if(!j.expo.plugins) j.expo.plugins=[];
          if(!JSON.stringify(j.expo.plugins).includes('expo-sensors')) j.expo.plugins.push('expo-sensors');
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          "

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: FIX SDK36 only - minimal
        run: |
          python3 - << 'PY'
          import pathlib, re
          p=pathlib.Path("android/build.gradle")
          t=p.read_text()
          t=re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', t)
          t=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', t)
          t=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', t)
          t=re.sub(r'buildToolsVersion\s*=\s*"[^"]+"', 'buildToolsVersion = "36.0.0"', t)
          t=re.sub(r'compileSdkVersion\s*=\s*safeExtGet\([^)]+\)', 'compileSdkVersion = 36', t)
          t=re.sub(r'targetSdkVersion\s*=\s*safeExtGet\([^)]+\)', 'targetSdkVersion = 36', t)
          p.write_text(t)

          ap=pathlib.Path("android/app/build.gradle")
          s=ap.read_text()
          s=re.sub(r'compileSdkVersion[^\n]*', 'compileSdkVersion 36', s)
          s=re.sub(r'targetSdkVersion[^\n]*', 'targetSdkVersion 36', s)
          s=re.sub(r'minSdkVersion[^\n]*', 'minSdkVersion 24', s)
          s=re.sub(r'versionCode \d+', 'versionCode 1', s)
          if 'singleVariant' not in s:
              s=s.replace('android {', 'android {\n publishing { singleVariant("release") }')
          # 只註釋掉 from components.release，唔重寫 signingConfigs
          s=s.replace('from components.release', '// from components.release')
          ap.write_text(s)

          mf=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml=mf.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in xml:
              mf.write_text(xml.replace("</application>", ' <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9890149028563226~8454882079"/>\n </application>'))
          PY

      - name: Use Permanent Keystore 40:0C:73 lapgo
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
          cp android/app/release.keystore android/app/upload-keystore.jks
          keytool -list -v -keystore android/app/release.keystore -alias ${{ secrets.KEYSTONE_ALIAS }} -storepass ${{ secrets.KEYSTONE_PASSWORD }} | grep -E "Alias name|SHA1"

      - name: Inject signing 40
        run: |
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          cat android/gradle.properties

      - name: Build AAB + APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload AAB+APK to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1-api36-${{ github.run_number }}
          name: FungSui-Go v1 API36
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
