name: Build FungSui-Go AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install SDK 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Force Expo 52 STONE SDK36 versionCode 2
        run: |
          rm -rf node_modules android package-lock.json
          node - << 'JS'
          const fs=require('fs');
          let pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.dependencies["expo"]="~52.0.46";
          pkg.dependencies["expo-sensors"]="~14.0.2";
          pkg.dependencies["expo-build-properties"]="~0.13.2";
          pkg.dependencies["react-native-google-mobile-ads"]="15.3.0";
          pkg.dependencies["react"]="18.3.1";
          pkg.dependencies["react-native"]="0.76.9";
          fs.writeFileSync('package.json', JSON.stringify(pkg,null,2));
          let app=JSON.parse(fs.readFileSync('app.json','utf8'));
          if(app.expo.android && app.expo.android.googleServicesFile) delete app.expo.android.googleServicesFile;
          app.expo.android.package="com.laptimego.fungsui";
          app.expo.android.versionCode=2;
          app.expo.android.compileSdkVersion=36;
          app.expo.android.targetSdkVersion=36;
          app.expo.android.minSdkVersion=24;
          app.expo.plugins=[
            "expo-sensors",
            ["expo-build-properties",{android:{compileSdkVersion:36,targetSdkVersion:36,minSdkVersion:24,buildToolsVersion:"36.0.0",kotlinVersion:"2.0.21"}}],
            ["react-native-google-mobile-ads",{androidAppId:"ca-app-pub-9890149028563226~8454882079"}]
          ];
          fs.writeFileSync('app.json', JSON.stringify(app,null,2));
          JS
          npm install --legacy-peer-deps

      - name: Expo prebuild clean
        run: npx expo prebuild --platform android --clean --no-install

      - name: HOTFIX V7 Kotlin 2.0.21 for ads
        run: |
          python3 - << 'PY'
          import pathlib, re
          mf=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t=mf.read_text()
          if "APPLICATION_ID" not in t:
              t=t.replace("</application>", '  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9890149028563226~8454882079"/>\n  </application>')
              mf.write_text(t)
          
          # patch gradle.properties
          gp=pathlib.Path("android/gradle.properties")
          txt=gp.read_text()
          lines=[l for l in txt.splitlines() if "MYAPP_" not in l and "kotlinVersion" not in l and l.strip()!=""]
          lines+=[
            "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g",
            "android.useAndroidX=true",
            "android.suppressUnsupportedCompileSdk=36",
            "newArchEnabled=false",
            "kotlinVersion=2.0.21",
            "kotlin.code.style=official"
          ]
          gp.write_text("\n".join(lines)+"\n")

          # patch app/build.gradle lint + kotlin jvmTarget
          ab=pathlib.Path("android/app/build.gradle")
          s=ab.read_text()
          s=s.replace("apply plugin: 'com.google.gms.google-services'","// removed gms")
          s=s.replace('apply plugin: "com.google.gms.google-services"',"// removed gms")
          if "lintOptions" not in s:
              s=s.replace("android {","android {\n lintOptions { abortOnError false; checkReleaseBuilds false }\n lint { abortOnError false; checkReleaseBuilds false }")
          if "jvmTarget" not in s:
              s=s.replace("compileOptions {","compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions { jvmTarget = '17' }\n    kotlin { jvmToolchain(17) }\n    compileOptions {")
          ab.write_text(s)

          # patch ads lib build.gradle to force kotlin 2.0.21
          ads = pathlib.Path("node_modules/react-native-google-mobile-ads/android/build.gradle")
          if ads.exists():
              sa=ads.read_text()
              sa=re.sub(r'compileSdk.*\d+', 'compileSdk 36', sa)
              sa=re.sub(r'targetSdk.*\d+', 'targetSdk 36', sa)
              ads.write_text(sa)
          PY

      - name: Keystore
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore

      - name: Signing
        run: |
          {
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore"
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}"
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}"
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          } >> android/gradle.properties

      - name: Build AAB+APK SDK36 versionCode 2
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon -x lintVitalAnalyzeRelease --stacktrace 2>&1 | tee /tmp/build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "===== REAL FAIL ====="
            grep -n -A 20 "e: file://\|Compilation error\|What went wrong" /tmp/build.log | tail -n 200
            exit 1
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1-api36-v2-${{ github.run_number }}
          name: FungSui-Go STONE 40:0C:73 SDK36 v2
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
