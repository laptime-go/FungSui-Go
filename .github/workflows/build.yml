name: Build FungSui-Go AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install SDK 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install deps
        run: |
          npm install
          npm install expo-build-properties
      - name: FORCE FIX app.json - NO AdMob plugin
        run: |
          node -e "
          const fs=require('fs');
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          j.expo.plugins=[
            'expo-sensors',
            ['expo-build-properties', {android:{compileSdkVersion:36,targetSdkVersion:36,minSdkVersion:24,buildToolsVersion:'36.0.0'}}]
          ];
          j.expo.android.package='com.laptimego.fungsui';
          j.expo.android.compileSdkVersion=36;
          j.expo.android.targetSdkVersion=36;
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          "
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
      - name: Inject AdMob + Ultimate Fix
        run: |
          python3 - << 'PY'
          import pathlib, re
          mf=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml=mf.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in xml:
              xml=xml.replace("</application>", '  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9890149028563226~8454882079"/>\n  </application>')
              mf.write_text(xml)
          p=pathlib.Path("android/app/build.gradle")
          s=p.read_text()
          # 1. 終極修 publishing
          s=s.replace('from components.release', 'from components.findByName("release")')
          # 如果仲有錯，直接刪除成個 publishing block
          s=re.sub(r'afterEvaluate\s*\{[^}]*publishing[^}]*\}[^}]*\}', '', s, flags=re.DOTALL)
          s=re.sub(r'publishing\s*\{[\s\S]*?\n\}\n\}', '', s)
          p.write_text(s)
          # 2. 加大 memory
          gp=pathlib.Path("android/gradle.properties")
          gp.write_text(gp.read_text() + "\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g\n")
          print("=== build.gradle tail ===")
          print(s[-3000:])
          PY
      - name: Keystore STONE 40:0C:73
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
      - name: Signing STONE
        run: |
          echo "" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
      - name: Build AAB+APK - debug true error
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon 2>&1 | tee build.log || true
          echo "==== FIRST FAILED TASK ===="
          grep -A 20 "FAILED\|> Task :.* FAILED\|error:\|Could not" build.log | head -n 150
          ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Upload
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1-api36-${{ github.run_number }}
          name: FungSui-Go v1 40:0C:73
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/build.log
