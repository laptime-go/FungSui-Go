name: Build FungSui-Go AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install SDK 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install deps
        run: |
          npm install
          npm install expo-build-properties
      - name: PATCH node_modules expo bug
        run: |
          python3 - << 'PY'
          import pathlib
          for p in pathlib.Path("node_modules").rglob("*.gradle"):
            try:
              s=p.read_text()
              if "components.release" in s:
                s=s.replace("from components.release",'from components.findByName("release")')
                s=s.replace("components.release",'components.findByName("release")')
                p.write_text(s)
            except: pass
          PY
      - name: FIX app.json
        run: |
          node -e "
          const fs=require('fs');
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          j.expo.plugins=[
            'expo-sensors',
            ['expo-build-properties', {android:{compileSdkVersion:36,targetSdkVersion:36,minSdkVersion:24,buildToolsVersion:'36.0.0'}}]
          ];
          j.expo.android.package='com.laptimego.fungsui';
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          "
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
      - name: PATCH android + AdMob ID
        run: |
          python3 - << 'PY'
          import pathlib
          mf=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml=mf.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in xml:
              xml=xml.replace("</application>", '  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9890149028563226~8454882079"/>\n  </application>')
              mf.write_text(xml)
          for p in pathlib.Path("android").rglob("*.gradle"):
            s=p.read_text()
            if "components.release" in s:
              s=s.replace("from components.release",'from components.findByName("release")')
              s=s.replace("components.release",'components.findByName("release")')
              p.write_text(s)
          # === 關鍵修復：修 gradle.properties 換行 ===
          gp=pathlib.Path("android/gradle.properties")
          txt=gp.read_text()
          txt=txt.replace("36.0.0MYAPP","36.0.0\nMYAPP")
          gp.write_text(txt)
          print(gp.read_text()[-1000:])
          PY
      - name: Keystore STONE 40:0C:73
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
      - name: Signing STONE - Fixed newline
        run: |
          printf "\n" >> android/gradle.properties
          printf "MYAPP_RELEASE_STORE_FILE=release.keystore\n" >> android/gradle.properties
          printf "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}\n" >> android/gradle.properties
          printf "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}\n" >> android/gradle.properties
          printf "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}\n" >> android/gradle.properties
          printf "MYAPP_UPLOAD_STORE_FILE=release.keystore\n" >> android/gradle.properties
          printf "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}\n" >> android/gradle.properties
          printf "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}\n" >> android/gradle.properties
          printf "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}\n" >> android/gradle.properties
          echo "---- gradle.properties ----"
          tail -20 android/gradle.properties
      - name: Build AAB+APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1-api36-${{ github.run_number }}
          name: FungSui-Go STONE 40:0C:73 v1
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
