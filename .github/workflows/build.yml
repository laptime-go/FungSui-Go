name: Build FungSui-Go AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install SDK 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install deps
        run: |
          npm install
          npm install expo-build-properties
      - name: FIX app.json
        run: |
          node -e "
          const fs=require('fs');
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          j.expo.plugins=[
            'expo-sensors',
            ['expo-build-properties', {android:{compileSdkVersion:36,targetSdkVersion:36,minSdkVersion:24,buildToolsVersion:'36.0.0'}}]
          ];
          j.expo.android.package='com.laptimego.fungsui';
          j.expo.android.compileSdkVersion=36;
          j.expo.android.targetSdkVersion=36;
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          "
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: PATCH ALL - release + compileSdk + AdMob - FINAL
        run: |
          python3 - << 'PY'
          import pathlib, re
          # 1. AdMob ID ca-app-pub-9890149028563226~8454882079
          mf=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml=mf.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in xml:
              xml=xml.replace("</application>", '  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9890149028563226~8454882079"/>\n  </application>')
              mf.write_text(xml)
              print("AdMob injected")

          def fix_file(p):
              try:
                  s=p.read_text(encoding='utf-8', errors='ignore')
                  orig=s
                  if "components.release" in s:
                      s=s.replace("from components.release", 'from components.findByName("release")')
                      s=s.replace("components.release", 'components.findByName("release")')
                  # hard fix compileSdkVersion
                  if "compileSdkVersion is not specified" in s or 'safeExtGet("compileSdkVersion"' in s:
                      s=re.sub(r'safeExtGet\("compileSdkVersion".*?\)', '36', s)
                      s=re.sub(r'compileSdkVersion\s+safeExtGet.*', 'compileSdkVersion 36', s)
                      s=re.sub(r'safeExtGet\("targetSdkVersion".*?\)', '36', s)
                      s=re.sub(r'targetSdkVersion\s+safeExtGet.*', 'targetSdkVersion 36', s)
                      s=re.sub(r'safeExtGet\("minSdkVersion".*?\)', '24', s)
                  if s!=orig:
                      p.write_text(s)
                      print(f"patched {p}")
              except: pass

          # patch node_modules 裡面所有 expo module (包括 :expo)
          for p in pathlib.Path("node_modules").rglob("build.gradle"):
              fix_file(p)
          # patch android 目錄生成出來的
          for p in pathlib.Path("android").rglob("build.gradle"):
              fix_file(p)

          # 修 gradle.properties 痴埋問題
          gp=pathlib.Path("android/gradle.properties")
          gp.write_text(gp.read_text().replace("36.0.0MYAPP","36.0.0\nMYAPP"))
          PY

      - name: Keystore STONE 40:0C:73
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
      - name: Signing STONE
        run: |
          printf "\nMYAPP_RELEASE_STORE_FILE=release.keystore\n" >> android/gradle.properties
          printf "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}\n" >> android/gradle.properties
          printf "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}\n" >> android/gradle.properties
          printf "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}\n" >> android/gradle.properties
          printf "MYAPP_UPLOAD_STORE_FILE=release.keystore\n" >> android/gradle.properties
          printf "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}\n" >> android/gradle.properties
          printf "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}\n" >> android/gradle.properties
          printf "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}\n" >> android/gradle.properties
      - name: Build AAB+APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1-api36-${{ github.run_number }}
          name: FungSui-Go STONE 40:0C:73 v1
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
