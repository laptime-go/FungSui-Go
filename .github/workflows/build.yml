name: Build FungSui-Go AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install SDK 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Force Expo 52 STONE SDK36 versionCode 2
        run: |
          rm -rf node_modules android package-lock.json
          node - << 'JS'
          const fs=require('fs');
          let pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.dependencies["expo"]="~52.0.46";
          pkg.dependencies["expo-sensors"]="~14.0.2";
          pkg.dependencies["expo-build-properties"]="~0.13.2";
          pkg.dependencies["react-native-google-mobile-ads"]="15.3.0";
          pkg.dependencies["react"]="18.3.1";
          pkg.dependencies["react-native"]="0.76.9";
          fs.writeFileSync('package.json', JSON.stringify(pkg,null,2));
          let app=JSON.parse(fs.readFileSync('app.json','utf8'));
          if(app.expo.android && app.expo.android.googleServicesFile) delete app.expo.android.googleServicesFile;
          app.expo.android.package="com.laptimego.fungsui";
          app.expo.android.versionCode=2;
          app.expo.android.compileSdkVersion=36;
          app.expo.android.targetSdkVersion=36;
          app.expo.android.minSdkVersion=24;
          app.expo.plugins=[
            "expo-sensors",
            ["expo-build-properties",{android:{compileSdkVersion:36,targetSdkVersion:36,minSdkVersion:24,buildToolsVersion:"36.0.0",kotlinVersion:"1.9.22"}}],
            ["react-native-google-mobile-ads",{androidAppId:"ca-app-pub-9890149028563226~8454882079", iosAppId:"ca-app-pub-9890149028563226~8454882079"}]
          ];
          fs.writeFileSync('app.json', JSON.stringify(app,null,2));
          JS
          npm install --legacy-peer-deps

      - name: Expo prebuild clean
        run: npx expo prebuild --platform android --clean --no-install

      - name: HOTFIX V6 SDK36 patch all libs
        run: |
          python3 - << 'PY'
          import pathlib, re
          # 1. Manifest add AdMob ID
          mf=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml=mf.read_text()
          if "APPLICATION_ID" not in xml:
              xml=xml.replace("</application>", '  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9890149028563226~8454882079"/>\n  </application>')
              mf.write_text(xml)
          # 2. Force all subprojects compileSdk 36, minSdk 24, kotlin 1.9.22
          for p in list(pathlib.Path("android").rglob("build.gradle")) + list(pathlib.Path("node_modules").rglob("build.gradle")):
            try:
              s=p.read_text(errors='ignore')
              orig=s
              # kill publishing
              s=re.sub(r'publishing\s*\{[\s\S]*?from\s+components\.release[\s\S]*?\}', ' ', s)
              # force compileSdk
              s=re.sub(r'compileSdk\s*=?\s*\d+', 'compileSdk 36', s)
              s=re.sub(r'compileSdkVersion\s*=?\s*\d+', 'compileSdkVersion 36', s)
              s=re.sub(r'targetSdk\s*=?\s*\d+', 'targetSdk 36', s)
              s=re.sub(r'targetSdkVersion\s*=?\s*\d+', 'targetSdkVersion 36', s)
              s=s.replace("apply plugin: 'com.google.gms.google-services'", "// removed")
              s=s.replace('apply plugin: "com.google.gms.google-services"', "// removed")
              s=re.sub(r'kotlin.*version.*2\.\d+\.\d+', "kotlinVersion = '1.9.22'", s)
              if s!=orig:
                  p.write_text(s)
            except: pass
          gp=pathlib.Path("android/gradle.properties")
          lines=[l for l in gp.read_text().splitlines() if "MYAPP_" not in l and "kotlinVersion" not in l and l.strip()!=""]
          lines+=["org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g","android.useAndroidX=true","android.suppressUnsupportedCompileSdk=36","newArchEnabled=false","kotlinVersion=1.9.22","expo.useLegacyPackaging=true"]
          gp.write_text("\n".join(lines)+"\n")
          ab=pathlib.Path("android/app/build.gradle")
          s=ab.read_text()
          if "lintOptions" not in s:
              s=s.replace("android {","android {\n lintOptions { abortOnError false; checkReleaseBuilds false }\n lint { abortOnError false; checkReleaseBuilds false }")
          ab.write_text(s)
          PY

      - name: Keystore STONE 40:0C:73
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore

      - name: Signing STONE
        run: |
          {
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore"
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}"
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}"
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          } >> android/gradle.properties

      - name: Build AAB+APK SDK36 versionCode 2
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon -x lintVitalAnalyzeRelease --stacktrace 2>&1 | tee /tmp/build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "========== REAL FAIL AT =========="
            grep -n "FAILED\|What went wrong\|Execution failed" /tmp/build.log | tail -n 50
            echo "========== DETAIL =========="
            grep -n -A 30 "What went wrong" /tmp/build.log | tail -n 100
            exit 1
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1-api36-v2-${{ github.run_number }}
          name: FungSui-Go STONE 40:0C:73 SDK36 v2
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
