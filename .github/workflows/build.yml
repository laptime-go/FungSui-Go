name: Build FungSui-Go v25 API36 FINAL
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install deps
        run: npm install
      - name: Expo prebuild true 36
        run: npx expo prebuild --clean --platform android
      - name: Force kotlin 2.0.21 + clean 34
        run: |
          python3 - << 'PY'
          import pathlib, re, json
          for p in pathlib.Path("android").rglob("*.gradle"):
              t=p.read_text()
              t=re.sub(r'kotlinVersion\s*=\s*["\']?[\d\.]+["\']?', 'kotlinVersion = "2.0.21"', t)
              t=t.replace('1.9.22','2.0.21')
              t=re.sub(r'compileSdkVersion\s*=\s*34','compileSdkVersion = 36',t)
              t=re.sub(r'targetSdkVersion\s*=\s*34','targetSdkVersion = 36',t)
              p.write_text(t)
          bg=pathlib.Path("android/build.gradle").read_text()
          bg=re.sub(r'id\s+["\']org.jetbrains.kotlin.android["\']\s+version\s+["\'][\d\.]+["\']', 'id "org.jetbrains.kotlin.android" version "2.0.21"', bg)
          pathlib.Path("android/build.gradle").write_text(bg)
          print("patched kotlin to 2.0.21 and SDK to 36")
          PY
      - name: Use Permanent Keystore
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
          cp android/app/release.keystore android/app/upload-keystore.jks
      - name: Inject signing
        run: |
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
      - name: Build AAB + APK API36
        run: |
          cd android
          chmod +x gradlew
         ./gradlew bundleRelease assembleRelease --no-daemon -x lint
      - name: Upload AAB+APK to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v25-api36-${{ github.run_number }}
          name: fungsui Go v25 API36 FINAL #${{ github.run_number }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
