name: Build FungSui-Go AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install deps
        run: |
          rm -rf node_modules android ios
          npm install

      - name: Force app.json to 36 + v1 FungSui + ICON FIX
        run: |
          node -e "
          const fs=require('fs');
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          j.expo=j.expo||{};
          j.expo.name='風水佬Go';
          j.expo.slug='fungsui-go';
          j.expo.version='1.0.0';
          j.expo.orientation='portrait';
          j.expo.icon='./icon.jpg';
          j.expo.splash=j.expo.splash||{};
          j.expo.splash.backgroundColor='#000000';
          j.expo.splash.resizeMode='contain';
          j.expo.splash.image='./icon.jpg';
          j.expo.android=j.expo.android||{};
          j.expo.android.package='com.laptimego.fungsui';
          j.expo.android.compileSdkVersion=36;
          j.expo.android.targetSdkVersion=36;
          j.expo.android.minSdkVersion=24;
          j.expo.android.versionCode=1;
          j.expo.android.adaptiveIcon={ foregroundImage: './icon.jpg', backgroundColor: '#000000' };
          j.expo.plugins=[['expo-sensors']];
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          console.log('patched FungSui to 36 v1 + icon.jpg');
          "

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: ULTIMATE FORCE Fix API 36 + Fix expo release bug + Inject AdMob
        run: |
          python3 - << 'PY'
          import pathlib, re
          ap = pathlib.Path("android/app/build.gradle")
          s = ap.read_text()

          # === 終極殺 afterEvaluate，計括號刪，唔再靠正則 ===
          lines = s.splitlines()
          out = []
          in_after = False
          brace = 0
          for line in lines:
              if not in_after and 'afterEvaluate' in line:
                  in_after = True
                  brace = line.count('{') - line.count('}')
                  if brace <= 0:
                      brace = 1
                  continue
              if in_after:
                  brace += line.count('{') - line.count('}')
                  if brace <= 0:
                      in_after = False
                  continue
              out.append(line)
          s = "\n".join(out)
          
          # 清晒所有 components.release 殘留
          s = s.replace('from components.release', '// removed')
          s = s.replace('components.release', '// removed')
          s = s.replace('from components.findByName("release").findByName', 'from components.findByName("release")')
          s = re.sub(r'versionCode \d+', 'versionCode 1', s)
          s = re.sub(r'versionName ".*?"', 'versionName "1.0.0"', s)

          if 'singleVariant' not in s:
              s = s.replace('android {', 'android {\n    publishing { singleVariant("release") }')

          ap.write_text(s)
          print("FIXED afterEvaluate release bug")

          # SDK 36
          bg_path = pathlib.Path("android/build.gradle")
          if bg_path.exists():
              bg = bg_path.read_text()
              bg = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', bg)
              bg = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', bg)
              bg = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', bg)
              bg_path.write_text(bg)

          for p in pathlib.Path("android").rglob("build.gradle"):
              try:
                  t = p.read_text()
                  if 'compileSdkVersion 34' in t or 'targetSdkVersion 34' in t:
                      t = t.replace('compileSdkVersion 34','compileSdkVersion 36').replace('targetSdkVersion 34','targetSdkVersion 36')
                      p.write_text(t)
              except: pass

          mf = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml = mf.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in xml:
              xml = xml.replace("</application>", '  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9890149028563226~8454882079"/>\n  </application>')
              mf.write_text(xml)
              print("Injected AdMob ID")
          PY

      - name: Use Permanent Keystore 40:0C:73 lapgo + Inject signing
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/app/upload-keystore.jks
          cp android/app/release.keystore android/release.keystore
          sed -i '/MYAPP_RELEASE/d' android/gradle.properties || true
          sed -i '/MYAPP_UPLOAD/d' android/gradle.properties || true
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          keytool -list -v -keystore android/app/release.keystore -alias ${{ secrets.KEYSTONE_ALIAS }} -storepass ${{ secrets.KEYSTONE_PASSWORD }} | grep -E "SHA1|Alias"

      - name: Build AAB + APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
          echo "=== FINAL CHECK MUST BE 40:0C:73 ==="
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep SHA1 || true

      - name: Upload AAB+APK to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1-api36-${{ github.run_number }}
          name: FungSui-Go v1 API36 #${{ github.run_number }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
