name: Build FungSui-Go AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env: { NODE_ENV: production }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install SDK 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Force Expo 52 + FIX App.js 103
        run: |
          rm -rf node_modules android package-lock.json
          node - << 'JS'
          const fs=require('fs');
          let s=fs.readFileSync('App.js','utf8');
          s=s.replace(/mSub\s*&&\s*mSub\.return\s*\(\)\s*=>\s*\{\s*try\{\s*remove\(\)/g, 'mSub && mSub.remove');
          s=s.replace(/try\s*\{\s*mSub\s*&&\s*mSub\.return[\s\S]*?catch\(e\)\{\}/, 'try { mSub && mSub.remove(); } catch(e){}\n      try { aSub && aSub.remove(); } catch(e){}');
          // 加 [] 防止無限 loop
          if(!s.includes('}, []);')) console.log('check useEffect deps');
          fs.writeFileSync('App.js', s);
          console.log('App.js fixed');
          let pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.dependencies["expo"]="~52.0.46";
          pkg.dependencies["expo-sensors"]="~14.0.2";
          pkg.dependencies["expo-build-properties"]="~0.13.2";
          pkg.dependencies["react-native-google-mobile-ads"]="14.12.1";
          fs.writeFileSync('package.json', JSON.stringify(pkg,null,2));
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          if(j.expo.android?.googleServicesFile) delete j.expo.android.googleServicesFile;
          j.expo.android.package="com.laptimego.fungsui";
          j.expo.android.versionCode=1;
          j.expo.android.compileSdkVersion=36;
          j.expo.android.targetSdkVersion=36;
          j.expo.android.minSdkVersion=24;
          j.expo.plugins=[
            "expo-sensors",
            ["expo-build-properties", {android:{compileSdkVersion:36,targetSdkVersion:36,minSdkVersion:24,buildToolsVersion:"36.0.0",kotlinVersion:"1.9.25"}}],
            ["react-native-google-mobile-ads", {androidAppId:"ca-app-pub-9890149028563226~8454882079"}]
          ];
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          JS
          npm install --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: HOTFIX manifest
        run: |
          rm -f google-services.json android/app/google-services.json
          python3 - << 'PY'
          import pathlib, re
          mf=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml=mf.read_text()
          if "APPLICATION_ID" not in xml:
              xml=xml.replace("</application>", '  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9890149028563226~8454882079"/>\n  </application>')
              mf.write_text(xml)
          PY

      - name: Keystore STONE
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore

      - name: Signing
        run: |
          {
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore"
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}"
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}"
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          } >> android/gradle.properties

      - name: Build FIXED
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon -x lintVitalAnalyzeRelease

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-fix-loop-${{ github.run_number }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
