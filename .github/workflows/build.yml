name: Build FungSui-Go SDK36 NOCRASH FINAL
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install SDK 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install deps
        run: |
          rm -rf node_modules android package-lock.json google-services.json
          npm install --legacy-peer-deps
          rm -rf node_modules/jsc-android
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install
      - name: HOTFIX SDK36
        run: |
          python3 - << 'PY'
          import pathlib
          for g in pathlib.Path("android").rglob("build.gradle"):
              try:
                  t=g.read_text()
                  if "jsc-android" in t: 
                      continue
                  t=t.replace("compileSdkVersion 35","compileSdkVersion 36").replace("targetSdkVersion 35","targetSdkVersion 36").replace("compileSdk 35","compileSdk 36")
                  if "components.release" in t:
                      t=t.replace("from components.release",'from components.findByName("release")')
                  g.write_text(t)
              except: pass
          gp=pathlib.Path("android/gradle.properties")
          txt=gp.read_text()
          txt+="\nandroid.suppressUnsupportedCompileSdk=36\nnewArchEnabled=false\norg.gradle.jvmargs=-Xmx4096m\n"
          gp.write_text(txt)
          PY
          rm -rf android/app/src/main/jniLibs
      - name: Keystore
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
      - name: Signing
        run: |
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
      - name: Build SDK36
        run: cd android; chmod +x gradlew; ./gradlew bundleRelease assembleRelease --no-daemon -x lint --stacktrace
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-sdk36-final-${{ github.run_number }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
