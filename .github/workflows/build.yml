name: Build FungSui-Go v1.0 API36 FINAL
on: { workflow_dispatch: }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install deps
        run: npm install
      - name: Force app.json to v1.0 code1 API36
        run: |
          node -e "
          const fs=require('fs');
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          j.expo.version='1.0.0';
          j.expo.android.versionCode=1;
          j.expo.android.minSdkVersion=24;
          let bp=j.expo.plugins.find(p=>Array.isArray(p)&&p[0]==='expo-build-properties');
          bp[1].android.minSdkVersion=24;
          bp[1].android.compileSdkVersion=36;
          bp[1].android.targetSdkVersion=36;
          bp[1].android.kotlinVersion='1.9.22';
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          console.log(fs.readFileSync('app.json','utf8'));
          "
      - name: Expo prebuild
        run: npx expo prebuild --clean --platform android
      - name: ULTIMATE FIX API36 break red loop
        run: |
          python3 - << 'PY'
          import pathlib, re
          # 1. 容許36
          open('android/gradle.properties','a').write('\nandroid.suppressUnsupportedCompileSdk=36\n')
          # 2. 全面force 36
          for p in pathlib.Path("android").rglob("*.gradle"):
            try:
              t=p.read_text(encoding='utf-8', errors='ignore')
              orig=t
              t=re.sub(r'compileSdkVersion\s*=?\s*\d+', 'compileSdkVersion = 36', t)
              t=re.sub(r'targetSdkVersion\s*=?\s*\d+', 'targetSdkVersion = 36', t)
              t=re.sub(r'compileSdk\s*=?\s*\d+', 'compileSdk = 36', t)
              t=t.replace('rootProject.ext.compileSdkVersion','36').replace('rootProject.ext.targetSdkVersion','36').replace('compileSdkVersion 34','compileSdkVersion 36').replace('targetSdkVersion 34','targetSdkVersion 36')
              if t!=orig:
                p.write_text(t, encoding='utf-8')
            except: pass
          # 3. Fix Kotlin nullable Array bug
          core=pathlib.Path("android/app/build.gradle")
          if core.exists():
            t=core.read_text()
            if 'kotlinOptions' not in t:
              t=t.replace('android {', 'android {\n kotlinOptions { jvmTarget = \"17\" }\n')
              core.write_text(t)
          PY
      - name: Use Permanent Keystore
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
          cp android/app/release.keystore android/app/upload-keystore.jks
      - name: Inject signing
        run: |
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
      - name: Build AAB + APK
        run: |
          cd android
          chmod +x gradlew
         ./gradlew bundleRelease assembleRelease --no-daemon -x lint
      - name: Upload
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1.0-api36-${{ github.run_number }}
          name: fungsui Go v1.0 API36 #${{ github.run_number }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
