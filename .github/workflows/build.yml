name: Build Fungsui Go AAB + APK
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install deps
        run: npm install

      - name: Force app.json to 36 BEFORE prebuild
        run: |
          node -e "
          const fs=require('fs');
          let raw=fs.readFileSync('app.json','utf8');
          let j=JSON.parse(raw);
          j.expo.version='1.0.0';
          j.expo.android.versionCode=21;
          j.expo.android.package='com.laptimego.fungsui';
          // 確保 plugins 有 36
          let p=j.expo.plugins.find(x=>Array.isArray(x)&&x[0]==='expo-build-properties');
          if(p){ p[1].android.compileSdkVersion=36; p[1].android.targetSdkVersion=36; p[1].android.buildToolsVersion='36.0.0'; p[1].android.minSdkVersion=24; }
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          console.log('app.json forced to 36');
          "

      - name: Expo prebuild android only
        run: npx expo prebuild --clean --platform android

      - name: Fix Expo Gradle 85 release Bug
        run: |
          for F in node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle node_modules/expo/android/build.gradle; do
            [ -f "$F" ] && sed -i 's/components\.release/components.findByName("release")/g; s/components\.debug/components.findByName("debug")/g' "$F" && echo "Patched $F"
          done

      - name: ULTIMATE FORCE Fix API 36 - 唔刪 rootProject.ext
        run: |
          python3 - << 'PY'
          import pathlib, re
          # 只改 android/build.gradle 的 ext 值，保留 rootProject.ext.xxx 引用
          bg_path = pathlib.Path("android/build.gradle")
          bg = bg_path.read_text()
          bg = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', bg)
          bg = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', bg)
          bg = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', bg)
          bg = re.sub(r'buildToolsVersion\s*=\s*["\'].*?["\']', 'buildToolsVersion = "36.0.0"', bg)
          bg_path.write_text(bg)

          # app/build.gradle 升 36 同 v21
          ap = pathlib.Path("android/app/build.gradle")
          s = ap.read_text()
          s = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', s)
          s = re.sub(r'targetSdk\s+\d+', 'targetSdk 36', s)
          s = re.sub(r'versionCode \d+', 'versionCode 21', s)
          s = re.sub(r'versionName ".*?"', 'versionName "1.0.0"', s)
          ap.write_text(s)

          # 確認
          import subprocess
          print("--- android/build.gradle ext ---")
          print(bg[:2000])
          print("--- version ---")
          subprocess.call(["grep","-n","compileSdk\|targetSdk\|versionCode","android/build.gradle","android/app/build.gradle"])
          PY

      - name: Use Keystore
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore

      - name: Inject signing
        run: |
          sed -i '/MYAPP_/d' android/gradle.properties
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties

      - name: Build AAB + APK
        run: |
          cd android
          chmod +x gradlew
         ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload AAB+APK
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v21-api36-${{ github.run_number }}
          name: fungsui v21 API36 #${{ github.run_number }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
