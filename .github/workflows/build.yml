name: Build FungSui-Go AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install SDK 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Clean install - STONE
        run: |
          rm -rf node_modules android
          npm install

      - name: AUTO FIX app.json + dummy gservices - STONE
        run: |
          node - << 'JS'
          const fs=require('fs');
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          // 刪走會令 prebuild 38s 死的 field
          if(j.expo.android.googleServicesFile) delete j.expo.android.googleServicesFile;
          // 保證 plugins 正確
          j.expo.plugins=[
            "expo-sensors",
            ["expo-build-properties", {android:{compileSdkVersion:36,targetSdkVersion:36,minSdkVersion:24,buildToolsVersion:"36.0.0"}}],
            ["react-native-google-mobile-ads", {androidAppId:"ca-app-pub-9890149028563226~8454882079"}]
          ];
          j.expo.android.package="com.laptimego.fungsui";
          j.expo.android.compileSdkVersion=36;
          j.expo.android.targetSdkVersion=36;
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          // 起 dummy google-services.json 防止 plugin 炸
          if(!fs.existsSync('google-services.json')){
            fs.writeFileSync('google-services.json', '{}');
          }
          console.log("app.json fixed");
          JS

      - name: Expo prebuild clean
        run: |
          npx expo --version
          npx expo prebuild --platform android --clean --no-install --verbose

      - name: NUCLEAR FIX - STONE 40:0C:73 + AdMob 8454882079
        run: |
          python3 - << 'PY'
          import pathlib, re
          mf=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml=mf.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in xml:
              xml=xml.replace("</application>", '  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9890149028563226~8454882079"/>\n  </application>')
              mf.write_text(xml)
              print("AdMob injected")

          for p in list(pathlib.Path("node_modules").rglob("build.gradle")) + list(pathlib.Path("android").rglob("build.gradle")):
              try:
                  s=p.read_text(errors='ignore')
                  orig=s
                  if "components.release" in s:
                      s=re.sub(r'publishing\s*\{[\s\S]*?from\s+components\.release[\s\S]*?\}\s*\}', ' ', s)
                      s=s.replace("from components.release", 'from components.findByName("release")')
                      s=s.replace("components.release", 'components.findByName("release")')
                  if "compileSdkVersion is not specified" in s or 'safeExtGet("compileSdkVersion"' in s:
                      s=re.sub(r'safeExtGet\("compileSdkVersion".*?\)', '36', s)
                      s=re.sub(r'compileSdkVersion\s+safeExtGet.*', 'compileSdkVersion 36', s)
                      s=re.sub(r'safeExtGet\("targetSdkVersion".*?\)', '36', s)
                      s=re.sub(r'targetSdkVersion\s+safeExtGet.*', 'targetSdkVersion 36', s)
                      s=re.sub(r'safeExtGet\("minSdkVersion".*?\)', '24', s)
                  if s!=orig:
                      p.write_text(s)
                      print(f"FIXED {p}")
              except: pass

          gp=pathlib.Path("android/gradle.properties")
          txt=gp.read_text()
          txt=txt.replace("36.0.0MYAPP","36.0.0\nMYAPP")
          if "suppressUnsupportedCompileSdk" not in txt:
              txt+="\nandroid.suppressUnsupportedCompileSdk=36\n"
          gp.write_text(txt)
          PY

      - name: Keystore STONE 40:0C:73
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore

      - name: Signing STONE
        run: |
          {
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore"
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}"
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}"
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          } >> android/gradle.properties

      - name: Build AAB+APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon -x lintVitalAnalyzeRelease --stacktrace

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1-api36-${{ github.run_number }}
          name: FungSui-Go STONE 40:0C:73 v1
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
