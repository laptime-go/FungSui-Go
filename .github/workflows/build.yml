name: Build FungSui-Go AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install SDK 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Force Expo 52 STONE SDK36 versionCode 2
        run: |
          rm -rf node_modules android package-lock.json google-services.json
          node - << 'JS'
          const fs=require('fs');
          let pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.dependencies["expo"]="~52.0.46";
          pkg.dependencies["expo-sensors"]="~14.0.2";
          pkg.dependencies["expo-build-properties"]="~0.13.2";
          pkg.dependencies["react-native-google-mobile-ads"]="15.3.0";
          pkg.dependencies["react"]="18.3.1";
          pkg.dependencies["react-native"]="0.76.9";
          fs.writeFileSync('package.json', JSON.stringify(pkg,null,2));
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          delete j.expo.android.googleServicesFile;
          j.expo.android.package="com.laptimego.fungsui";
          j.expo.android.versionCode=2;
          j.expo.android.compileSdkVersion=36;
          j.expo.android.targetSdkVersion=36;
          j.expo.android.minSdkVersion=24;
          j.expo.plugins=[
            "expo-sensors",
            ["expo-build-properties", {android:{compileSdkVersion:36,targetSdkVersion:36,minSdkVersion:24,buildToolsVersion:"36.0.0",kotlinVersion:"1.9.22"}}],
            ["react-native-google-mobile-ads", {androidAppId:"ca-app-pub-9890149028563226~8454882079"}]
          ];
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          fs.writeFileSync('google-services.json','{}');
          JS
          npm install --legacy-peer-deps

      - name: Expo prebuild clean
        run: npx expo prebuild --platform android --clean --no-install

      - name: HOTFIX V4 SDK36 kill all crash
        run: |
          rm -f google-services.json android/app/google-services.json
          python3 - << 'PY'
          import pathlib, re, sys
          mf=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t=mf.read_text()
          if "APPLICATION_ID" not in t:
              t=t.replace("</application>", ' <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9890149028563226~8454882079"/>\n </application>')
              mf.write_text(t)
          # 1. kill all publishing + gms + kotlin version
          for fp in list(pathlib.Path("node_modules").rglob("build.gradle")) + list(pathlib.Path("android").rglob("build.gradle")):
              try:
                  s=fp.read_text(errors='ignore')
                  orig=s
                  s=re.sub(r'publishing\s*\{[^}]*from\s+components\.release[^}]*\}', ' ', s, flags=re.DOTALL)
                  s=s.replace("from components.release", "from components.findByName('release')?: components.findByName('default')")
                  s=s.replace("components.release", "components.findByName('release')")
                  s=s.replace("apply plugin: 'com.google.gms.google-services'", "// removed gms")
                  s=s.replace('apply plugin: "com.google.gms.google-services"', "// removed gms")
                  if s!=orig:
                      fp.write_text(s)
              except: pass
          gp=pathlib.Path("android/gradle.properties")
          txt=gp.read_text()
          txt=re.sub(r'kotlinVersion.*', 'kotlinVersion=1.9.22', txt)
          txt=txt.replace("2.0.21","1.9.22").replace("2.0.0","1.9.22").replace("1.9.24","1.9.22")
          txt+="\nandroid.suppressUnsupportedCompileSdk=36\nnewArchEnabled=false\norg.gradle.jvmargs=-Xmx4096m\nandroid.useAndroidX=true\n"
          gp.write_text(txt)
          # 2. force lint off in app/build.gradle
          ab=pathlib.Path("android/app/build.gradle")
          s=ab.read_text()
          if "lintOptions" not in s:
              s=s.replace("android {", "android {\n lintOptions { abortOnError false; checkReleaseBuilds false }\n lint { abortOnError false; checkReleaseBuilds false }")
          ab.write_text(s)
          PY

      - name: Keystore STONE 40:0C:73
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore

      - name: Signing
        run: |
          for k in RELEASE UPLOAD; do
            echo "MYAPP_${k}_STORE_FILE=release.keystore"
            echo "MYAPP_${k}_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}"
            echo "MYAPP_${k}_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
            echo "MYAPP_${k}_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          done >> android/gradle.properties

      - name: Build AAB+APK SDK36 versionCode 2
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon -x lintVitalAnalyzeRelease -x lintVitalReportRelease --stacktrace 2>&1 | tee /tmp/build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "========== REAL FAIL REASON =========="
            grep -n -A 30 "FAILED\|FAILURE\|Execution failed\|What went wrong" /tmp/build.log | tail -n 200
            exit 1
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1-api36-v2-${{ github.run_number }}
          name: FungSui-Go STONE 40:0C:73 SDK36 v2
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
