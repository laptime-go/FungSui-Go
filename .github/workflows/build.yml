name: Build FungSui-Go SDK36 NO-CRASH
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Clean
        run: |
          rm -rf node_modules android package-lock.json
          npm install --legacy-peer-deps
          rm -rf node_modules/jsc-android
          npm list react-native-google-mobile-ads
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
      - name: Force Fix Gradle + No JSC + SDK36
        run: |
          sed -i 's/components\.release/components.findByName("release")/g; s/components\.debug/components.findByName("debug")/g' node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle || true
          sed -i 's/components\.release/components.findByName("release")/g; s/components\.debug/components.findByName("debug")/g' node_modules/expo/android/build.gradle || true
          # 強制閂 newArch，呢個係 14.11.0 死 app 元凶
          echo "newArchEnabled=false" >> android/gradle.properties
          echo "hermesEnabled=true" >> android/gradle.properties
          echo "expo.jsEngine=hermes" >> android/gradle.properties
          python3 - << 'PY'
          import pathlib, re
          p=pathlib.Path("android/gradle.properties")
          t=p.read_text()
          if "androidXMigration" not in t: t+="\nandroidXMigration=true\n"
          p.write_text(t)
          for f in ["android/build.gradle","android/app/build.gradle"]:
            fp=pathlib.Path(f)
            if not fp.exists(): continue
            txt=fp.read_text()
            txt=re.sub(r'compileSdkVersion\s*=\s*\d+','compileSdkVersion = 36',txt)
            txt=re.sub(r'targetSdkVersion\s*=\s*\d+','targetSdkVersion = 36',txt)
            txt=re.sub(r'minSdkVersion\s*=\s*\d+','minSdkVersion = 24',txt)
            fp.write_text(txt)
          print("patched")
          PY
          cat android/gradle.properties
      - name: Keystore + Sign
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
      - name: Build
        run: cd android; chmod +x gradlew; ./gradlew bundleRelease assembleRelease --no-daemon -x lint --stacktrace
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-no-crash-${{ github.run_number }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
