name: Build FungSui-Go v1 API36 PlayStore
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install deps
        run: npm install

      - name: Force app.json to 36 + v1 BEFORE prebuild
        run: |
          node -e "
          const fs=require('fs');
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          j.expo.android.versionCode=1;
          j.expo.plugins=j.expo.plugins.map(p=>{
            if(Array.isArray(p) && p[0]==='expo-build-properties'){
              p[1].android.compileSdkVersion=36;
              p[1].android.targetSdkVersion=36;
              p[1].android.minSdkVersion=24;
              p[1].android.kotlinVersion='2.0.21';
            }
            return p;
          });
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          "

      - name: Expo prebuild
        run: npx expo prebuild --clean --platform android

      - name: ULTIMATE FORCE Fix API 36 Kotlin 2.0.21
        run: |
          python3 - << 'PY'
          import pathlib, re
          for p in pathlib.Path("android").rglob("build.gradle"):
              try:
                  t=p.read_text()
                  t=re.sub(r'compileSdkVersion\s*=?\s*\d+', 'compileSdkVersion = 36', t)
                  t=re.sub(r'targetSdkVersion\s*=?\s*\d+', 'targetSdkVersion = 36', t)
                  t=re.sub(r'kotlinVersion\s*=\s*\"[^\"]+\"', 'kotlinVersion = "2.0.21"', t)
                  t=re.sub(r"kotlinVersion\s*=\s*'[^']+'", "kotlinVersion = '2.0.21'", t)
                  p.write_text(t)
              except: pass
          gp=pathlib.Path("android/gradle.properties")
          if gp.exists():
              txt=gp.read_text()
              txt=re.sub(r'kotlinVersion=.*','kotlinVersion=2.0.21',txt)
              if "kotlinVersion" not in txt: txt+="\nkotlinVersion=2.0.21\n"
              gp.write_text(txt)
          PY

      - name: Use Permanent Keystore
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore || true
          cp android/app/release.keystore android/app/upload-keystore.jks || true

      - name: Inject signing
        run: |
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties

      - name: Build AAB + APK
        run: |
          cd android
          chmod +x gradlew
         ./gradlew bundleRelease assembleRelease --no-daemon -x lint

      - name: Upload AAB+APK to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1-api36-${{ github.run_number }}
          name: fungsui Go v1 API36 Play #${{ github.run_number }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
