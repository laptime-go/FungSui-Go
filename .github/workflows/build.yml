name: Build FungSui-Go AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install deps
        run: npm install

      - name: Force app.json
        run: |
          node -e "
          const fs=require('fs');
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          j.expo=j.expo||{};
          j.expo.name='風水佬Go';
          j.expo.slug='fungsui-go';
          j.expo.version='1.0.0';
          j.expo.orientation='portrait';
          j.expo.icon='./icon.jpg';
          j.expo.splash={backgroundColor:'#000000', resizeMode:'contain', image:'./icon.jpg'};
          j.expo.ios={bundleIdentifier:'com.laptimego.fungsui'};
          j.expo.android={package:'com.laptimego.fungsui', compileSdkVersion:36, targetSdkVersion:36, minSdkVersion:24, versionCode:1, adaptiveIcon:{foregroundImage:'./icon.jpg', backgroundColor:'#000000'}};
          j.expo.plugins=[['expo-sensors']];
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          "

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: NUKE release bug + FIX compileSdkVersion
        run: |
          python3 - << 'PY'
          import pathlib, re
          def nuke_publishing(text):
              while True:
                  m = re.search(r'afterEvaluate\s*\{', text)
                  if not m: break
                  start = m.start()
                  depth=0; end=-1
                  for i in range(m.end()-1, len(text)):
                      if text[i]=='{': depth+=1
                      elif text[i]=='}':
                          depth-=1
                          if depth==0:
                              end=i; break
                  if end!=-1:
                      text=text[:start]+'// NUKED afterEvaluate\n'+text[end+1:]
                  else: break
              text=re.sub(r'publishing\s*\{[^\}]*from\s+components\.release[^\}]*\}[^\}]*\}', '// NUKED publishing', text, flags=re.DOTALL)
              text=text.replace('from components.release','// NUKED from components.release')
              return text

          nuked=0
          for p in pathlib.Path(".").rglob("*.gradle"):
              if ".git" in str(p): continue
              try:
                  t=p.read_text()
                  if 'components.release' in t:
                      nt=nuke_publishing(t)
                      if nt!=t:
                          p.write_text(nt)
                          nuked+=1
              except: pass
          print(f"NUKED {nuked}")

          # FIX ext - 唔再 replace rootProject.ext 字串
          bg = pathlib.Path("android/build.gradle")
          s = bg.read_text()
          s = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
          s = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', s)
          s = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', s)
          bg.write_text(s)

          ap = pathlib.Path("android/app/build.gradle")
          s = ap.read_text()
          s = re.sub(r'versionCode \d+', 'versionCode 1', s)
          if 'singleVariant' not in s:
              s = s.replace('android {', 'android {\n publishing { singleVariant("release") }')
          ap.write_text(s)

          mf = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml = mf.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in xml:
              mf.write_text(xml.replace("</application>", ' <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9890149028563226~8454882079"/>\n </application>'))
          PY

      - name: Use Permanent Keystore 40:0C:73 lapgo
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
          cp android/app/release.keystore android/app/upload-keystore.jks
          keytool -list -v -keystore android/app/release.keystore -alias ${{ secrets.KEYSTONE_ALIAS }} -storepass ${{ secrets.KEYSTONE_PASSWORD }} | grep -E "Alias name|SHA1"

      - name: Inject signing 40
        run: |
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties

      - name: Build AAB + APK
        run: |
          cd android
          python3 - << 'PY'
          import pathlib, re
          p=pathlib.Path("app/build.gradle").read_text()
          new_block=""" signingConfigs {
              debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
              release { storeFile file('release.keystore'); storePassword System.getenv("KS_PASS")?: "123456"; keyAlias System.getenv("KS_ALIAS")?: "lapgo"; keyPassword System.getenv("KS_PASS")?: "123456" }
          }
          """
          p=re.sub(r'signingConfigs\s*\{.*?^\s*\}\s*\n\s*buildTypes', new_block+'\nbuildTypes', p, flags=re.MULTILINE|re.DOTALL)
          p=p.replace('signingConfig signingConfigs.debug','signingConfig signingConfigs.release')
          pathlib.Path("app/build.gradle").write_text(p)
          PY
          chmod +x gradlew
          export KS_PASS="${{ secrets.KEYSTONE_PASSWORD }}"
          export KS_ALIAS="${{ secrets.KEYSTONE_ALIAS }}"
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload AAB+APK to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1-api36-${{ github.run_number }}
          name: FungSui-Go v1 API36
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
