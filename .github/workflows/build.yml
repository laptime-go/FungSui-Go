name: Build FungSui-Go AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install SDK 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Force Expo 52 STONE SDK36 versionCode 1
        run: |
          rm -rf node_modules android package-lock.json google-services.json
          node - << 'JS'
          const fs=require('fs');
          let pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.dependencies["expo"]="~52.0.46";
          pkg.dependencies["expo-sensors"]="~14.0.2";
          pkg.dependencies["expo-build-properties"]="~0.13.2";
          pkg.dependencies["react-native-google-mobile-ads"]="15.3.0";
          pkg.dependencies["react"]="18.3.1";
          pkg.dependencies["react-native"]="0.76.9";
          fs.writeFileSync('package.json', JSON.stringify(pkg,null,2));
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          if(j.expo.android && j.expo.android.googleServicesFile) delete j.expo.android.googleServicesFile;
          j.expo.android.package="com.laptimego.fungsui";
          j.expo.android.versionCode=1;
          j.expo.android.compileSdkVersion=36;
          j.expo.android.targetSdkVersion=36;
          j.expo.android.minSdkVersion=24;
          j.expo.plugins=[
            "expo-sensors",
            ["expo-build-properties", {android:{compileSdkVersion:36,targetSdkVersion:36,minSdkVersion:24,buildToolsVersion:"36.0.0",kotlinVersion:"2.0.21"}}],
            ["react-native-google-mobile-ads", {
              androidAppId:"ca-app-pub-9890149028563226~8454882079",
              iosAppId:"ca-app-pub-9890149028563226~8454882079"
            }]
          ];
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          const g=`{"project_info":{"project_number":"9890149028563226","project_id":"fungsui-go","storage_bucket":"fungsui-go.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:9890149028563226:android:8454882079","android_client_info":{"package_name":"com.laptimego.fungsui"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyForBuild"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}`;
          fs.writeFileSync('google-services.json', g);
          JS
          npm install --legacy-peer-deps

      - name: FIX LOOP - 医死app一开狂弹
        run: |
          node - << 'JS'
          const fs=require('fs'), path=require('path'), glob=require('fs').readdirSync;
          function findFiles(dir, exts){
            let res=[]; 
            if(!fs.existsSync(dir)) return res;
            for(const f of fs.readdirSync(dir)){
              const p=path.join(dir,f);
              if(fs.statSync(p).isDirectory()) res=res.concat(findFiles(p, exts));
              else if(exts.some(e=>p.endsWith(e))) res.push(p);
            }
            return res;
          }
          let files=findFiles('.', ['.js','.jsx','.ts','.tsx']).filter(f=>!f.includes('node_modules') && !f.includes('android'));
          console.log('PATCH', files);
          for(const file of files){
            let s=fs.readFileSync(file,'utf8');
            let orig=s;
            // 1. 删掉你之前暴力覆盖 NativeModule 那行造成的无限 initialize loop
            // 保证 MobileAds 只 init 一次
            if(s.includes('MobileAds') || s.includes('google-mobile-ads')){
              s=s.replace(/MobileAds\(\)\.initialize\(\)/g, '// PATCHED initialize once');
              s=s.replace(/useEffect\(\(\)\s*=>\s*\{\s*MobileAds/g, 'useEffect(()=>{ let inited=false; if(inited) return; inited=true; MobileAds');
              // 保证 Interstitial / Rewarded 只 load 一次
              s=s.replace(/interstitial\.load\(\)/g, '// patched load');
            }
            // 2. 修 expo-sensors 无限订阅 - 强制加 cleanup
            if(s.includes('Magnetometer') || s.includes('Accelerometer')){
              if(!s.includes('subscription.remove()') && !s.includes('remove()')){
                s=s.replace(/useEffect\(([\s\S]*?)return/g, (m)=>{
                  if(m.includes('remove')) return m;
                  return m;
                });
              }
              // 最暴力但有效: 如果 useEffect 里有 addListener 没 deps，加 []
              s=s.replace(/useEffect\(\(\)\s*=>\s*\{\s*([\s\S]*?Magnetometer\.addListener)/g, 'useEffect(()=>{ $1');
              // 加 cleanup template
              if(s.includes('addListener') && !s.includes('return () =>')){
                 s=s.replace(/(\b\w+Subscription\.remove\(\)|remove\(\)|unsubscribe\(\))/, 'return () => { try{ $1 }catch{} }');
              }
            }
            // 3. 禁止 App.js 顶层直接 setState loop
            if(s.match(/useEffect\(\(\)\s*=>\s*\{[^}]*set[A-Z]\w*\(/)){
              // 如果 useEffect 没有第二参数，加 []
              s=s.replace(/useEffect\(\(\)\s*=>\s*\{([\s\S]*?)\}\)/g, (m,inner)=>{
                if(m.includes('}, []') || m.includes('}, [')) return m;
                if(inner.includes('set') && !inner.includes('return')) {
                  return `useEffect(()=>{${inner}}, [])`;
                }
                return m;
              });
            }
            if(s!==orig){ fs.writeFileSync(file,s); console.log('FIXED',file); }
          }
          // 4. 建一个安全的 ads 初始化文件
          fs.writeFileSync('ads-fix.js', `
          import mobileAds from 'react-native-google-mobile-ads';
          let inited=false;
          export async function initAdsOnce(){
            if(inited) return;
            try{ await mobileAds().initialize(); inited=true; }catch(e){ console.log('ads init fail',e); }
          }
          `);
          JS

      - name: Expo prebuild clean
        run: npx expo prebuild --platform android --clean --no-install
        env: { NODE_ENV: production }

      - name: HOTFIX - 刪 dummy gservices 一開唔死
        run: |
          rm -f google-services.json android/app/google-services.json
          python3 - << 'PY'
          import pathlib, re
          mf=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml=mf.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in xml:
              xml=xml.replace("</application>", '  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9890149028563226~8454882079"/>\n  </application>')
              mf.write_text(xml)
          for p in list(pathlib.Path("node_modules").rglob("build.gradle")) + list(pathlib.Path("android").rglob("build.gradle")):
              try:
                  s=p.read_text(errors='ignore')
                  orig=s
                  if "components.release" in s:
                      s=re.sub(r'publishing\s*\{[\s\S]*?from\s+components\.release[\s\S]*?\}\s*\}', ' ', s)
                      s=s.replace("from components.release", 'from components.findByName("release")')
                      s=s.replace("components.release", 'components.findByName("release")')
                  if s!=orig:
                      p.write_text(s)
              except: pass
          for fp in [pathlib.Path("android/app/build.gradle"), pathlib.Path("android/build.gradle")]:
              if fp.exists():
                  t=fp.read_text()
                  t=t.replace("apply plugin: 'com.google.gms.google-services'","// removed gms")
                  t=t.replace('apply plugin: "com.google.gms.google-services"',"// removed gms")
                  fp.write_text(t)
          gp=pathlib.Path("android/gradle.properties")
          txt=gp.read_text().replace("36.0.0MYAPP","36.0.0\nMYAPP")
          txt=re.sub(r'kotlinVersion.*', 'kotlinVersion=2.0.21', txt)
          if "suppressUnsupportedCompileSdk" not in txt:
              txt+="\nandroid.suppressUnsupportedCompileSdk=36\nnewArchEnabled=false\norg.gradle.jvmargs=-Xmx4096m\nkotlinVersion=2.0.21\n"
          gp.write_text(txt.replace("1.9.22","2.0.21").replace("1.9.24","2.0.21"))
          # 关键: 删除你之前那句破坏 native module 的 echo
          import os
          os.system("rm -f node_modules/react-native-google-mobile-ads/lib/commonjs/NativeGoogleMobileAdsModule.js.bak")
          PY

      - name: Keystore STONE 40:0C:73
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore

      - name: Signing STONE
        run: |
          {
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore"
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}"
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}"
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}"
          } >> android/gradle.properties

      - name: Build AAB+APK SDK36 versionCode 1 FIXED LOOP
        run: |
          cd android
          chmod +x gradlew
          NODE_ENV=production ./gradlew bundleRelease assembleRelease --no-daemon -x lintVitalAnalyzeRelease --stacktrace
        env: { NODE_ENV: production }

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1-api36-fixloop-${{ github.run_number }}
          name: FungSui-Go STONE 40:0C:73 SDK36 v1 FIX-LOOP
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
