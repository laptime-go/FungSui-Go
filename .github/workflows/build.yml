name: Build FungSui-Go v25 API36 FIXED
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install deps
        run: npm install
      - name: Expo prebuild true 36
        run: npx expo prebuild --clean --platform android
      - name: FIX kotlin 1.9.22 -> 2.0.21 for API36
        run: |
          echo "=== patch all gradle ==="
          find android -type f -name "*.gradle" -o -name "gradle.properties" | xargs sed -i 's/1\.9\.22/2.0.21/g'
          find android -type f -name "*.gradle" | xargs sed -i 's/compileSdkVersion = 34/compileSdkVersion = 36/g; s/targetSdkVersion = 34/targetSdkVersion = 36/g; s/compileSdkVersion 34/compileSdkVersion 36/g; s/targetSdkVersion 34/targetSdkVersion 36/g'
          # 確保 build.gradle 的 kotlin 插件版本
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "2.0.21"/' android/build.gradle
          # 強制 settings.gradle 嘅 pluginManagement
          if [ -f android/settings.gradle ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version ".*"/id("org.jetbrains.kotlin.android") version "2.0.21"/' android/settings.gradle
          fi
          # 加上兼容參數
          echo "kotlin.mpp.androidSourceSetLayoutVersion=2" >> android/gradle.properties
          echo "=== verify ==="
          grep -r "kotlinVersion\|kotlin.android" android/build.gradle | head -20
      - name: Use Permanent Keystore
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
          cp android/app/release.keystore android/app/upload-keystore.jks
      - name: Inject signing
        run: |
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
      - name: Build AAB + APK API36
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon -x lint --stacktrace
      - name: Upload AAB+APK to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v25-api36-fixed-${{ github.run_number }}
          name: fungsui Go v25 API36 FIXED #${{ github.run_number }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
