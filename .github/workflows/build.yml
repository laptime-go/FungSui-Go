name: Build FungSui-Go AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install deps
        run: npm install

      - name: Force app.json to 36 + v1 FungSui + ICON
        run: |
          node -e "
          const fs=require('fs');
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          j.expo=j.expo||{};
          j.expo.name='風水佬Go';
          j.expo.slug='fungsui-go';
          j.expo.version='1.0.0';
          j.expo.orientation='portrait';
          j.expo.icon='./icon.jpg';
          j.expo.splash={backgroundColor:'#000000', resizeMode:'contain', image:'./icon.jpg'};
          j.expo.android=j.expo.android||{};
          j.expo.android.package='com.laptimego.fungsui';
          j.expo.android.compileSdkVersion=36;
          j.expo.android.targetSdkVersion=36;
          j.expo.android.minSdkVersion=24;
          j.expo.android.versionCode=1;
          j.expo.android.adaptiveIcon={foregroundImage:'./icon.jpg', backgroundColor:'#000000'};
          j.expo.plugins=[['expo-sensors']];
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          console.log('patched FungSui to 36 v1 + icon.jpg');
          "

      - name: Expo prebuild
        run: npx expo prebuild --clean

      - name: ULTIMATE FORCE Fix API 36 + KILL release bug
        run: |
          python3 - << 'PY'
          import pathlib, re
          # 1. 全域改 36 - 用返你賽道得嗰個方法
          bg_path = pathlib.Path("android/build.gradle")
          if bg_path.exists():
              bg = bg_path.read_text()
              bg = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', bg)
              bg = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', bg)
              bg = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', bg)
              bg_path.write_text(bg)

          for p in pathlib.Path("android").rglob("*.gradle"):
              try:
                  t = p.read_text()
                  if 'rootProject.ext.compileSdkVersion' in t or 'components.release' in t:
                      t = t.replace('rootProject.ext.compileSdkVersion', '36')
                      t = t.replace('rootProject.ext.targetSdkVersion', '36')
                      t = t.replace('rootProject.ext.minSdkVersion', '24')
                      t = t.replace('from components.release', '// DELETED from components.release')
                      t = t.replace('components.release', '// DELETED')
                      t = re.sub(r'afterEvaluate\s*\{', '// afterEvaluate {', t)
                      # 保險：所有34改36
                      t = re.sub(r'compileSdkVersion\s*=?\s*34', 'compileSdkVersion = 36', t)
                      t = re.sub(r'targetSdkVersion\s*=?\s*34', 'targetSdkVersion = 36', t)
                      p.write_text(t)
                      print(f"Patched {p}")
              except: pass

          # 2. 強制 v1 + singleVariant
          ap = pathlib.Path("android/app/build.gradle")
          s = ap.read_text()
          s = re.sub(r'versionCode \d+', 'versionCode 1', s)
          s = re.sub(r'versionName ".*?"', 'versionName "1.0.0"', s)
          if 'singleVariant' not in s:
              s = s.replace('android {', 'android {\n    publishing { singleVariant("release") { withSourcesJar() } }')
          ap.write_text(s)
          print("forced to 36 v1 + killed release bug")

          # 3. AdMob ID
          mf = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml = mf.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in xml:
              xml = xml.replace("</application>", '  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9890149028563226~8454882079"/>\n  </application>')
              mf.write_text(xml)
              print("Injected AdMob ID")
          PY

      - name: Use Permanent Keystore 40:0C:73 lapgo
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
          cp android/app/release.keystore android/app/upload-keystore.jks
          echo "=== THIS BUILD SHOULD BE 40:0C:73 ==="
          keytool -list -v -keystore android/app/release.keystore -alias ${{ secrets.KEYSTONE_ALIAS }} -storepass ${{ secrets.KEYSTONE_PASSWORD }} | grep -E "Alias name|SHA1"

      - name: Inject signing 40 from Secrets
        run: |
          sed -i '/MYAPP_RELEASE/d' android/gradle.properties || true
          sed -i '/MYAPP_UPLOAD/d' android/gradle.properties || true
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties

      - name: Build AAB + APK
        run: |
          cd android
          cat > /tmp/fix.py << 'PY'
          import pathlib, re
          p = pathlib.Path("app/build.gradle").read_text()
          new_block = """
          signingConfigs {
              debug {
                  storeFile file('debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
              release {
                  storeFile file('release.keystore')
                  storePassword System.getenv("KS_PASS") ?: "123456"
                  keyAlias System.getenv("KS_ALIAS") ?: "lapgo"
                  keyPassword System.getenv("KS_PASS") ?: "123456"
              }
          }
          """
          p = re.sub(r'signingConfigs\s*\{.*?^\s*\}\s*\n\s*buildTypes', new_block + '\nbuildTypes', p, flags=re.MULTILINE|re.DOTALL)
          if 'signingConfig signingConfigs.debug' in p:
              p = p.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          pathlib.Path("app/build.gradle").write_text(p)
          print("Patched to release signing")
          PY
          python3 /tmp/fix.py
          chmod +x gradlew
          KS_PASS=${{ secrets.KEYSTONE_PASSWORD }} KS_ALIAS=${{ secrets.KEYSTONE_ALIAS }} ./gradlew bundleRelease assembleRelease --no-daemon
          echo "=== FINAL MUST BE 40:0C:73 / v1 / 36 ==="
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep SHA1

      - name: Upload AAB+APK to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1-api36-${{ github.run_number }}
          name: FungSui-Go v1 API36 #${{ github.run_number }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
