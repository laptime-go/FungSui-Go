name: Build FungSui-Go AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install deps
        run: |
          rm -rf node_modules android ios
          npm install

      - name: Force app.json WITHOUT ads plugin (fix typeof)
        run: |
          node -e "
          const fs=require('fs');
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          j.expo=j.expo||{};
          j.expo.name='風水佬Go';
          j.expo.slug='fungsui-go';
          j.expo.version='1.0.0';
          j.expo.android=j.expo.android||{};
          j.expo.android.package='com.laptimego.fungsui';
          j.expo.android.versionCode=1;
          j.expo.plugins=[['expo-sensors']];
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          console.log('patched WITHOUT ads plugin');
          "

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: ULTIMATE FORCE Fix API 36 + Inject AdMob ID + Fix release property
        run: |
          python3 - << 'PY'
          import pathlib, re
          # 1. FIX 你的圖 76行 ':expo' release - 要掃成個repo，包括 node_modules
          for p in pathlib.Path(".").rglob("build.gradle"):
            try:
              t = p.read_text()
              orig = t
              t = t.replace('rootProject.ext.compileSdkVersion', '36')
              t = t.replace('rootProject.ext.targetSdkVersion', '36')
              t = t.replace('rootProject.ext.minSdkVersion', '24')
              t = re.sub(r'compileSdkVersion\s*=?\s*34', 'compileSdkVersion = 36', t)
              t = re.sub(r'targetSdkVersion\s*=?\s*34', 'targetSdkVersion = 36', t)
              # 核心fix: :expo 嗰個錯
              t = t.replace('components.release', 'components.findByName("release")')
              t = t.replace('from components', 'from components.findByName')
              if t != orig:
                p.write_text(t)
                print(f"Patched {p}")
            except: pass

          # 2. app/build.gradle 加 singleVariant
          app_gradle = pathlib.Path("android/app/build.gradle")
          s = app_gradle.read_text()
          if 'singleVariant' not in s:
            s = s.replace('android {', 'android {\n    publishing { singleVariant("release") }')
          s = re.sub(r'versionCode \d+', 'versionCode 1', s)
          s = re.sub(r'versionName ".*?"', 'versionName "1.0.0"', s)
          app_gradle.write_text(s)
          print("Fixed release property + API36")

          # 3. Inject AdMob
          mf = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml = mf.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in xml:
            xml = xml.replace("</application>", '  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9890149028563226~8454882079"/>\n  </application>')
            mf.write_text(xml)
            print("Injected AdMob ID")
          PY

      - name: Use Permanent Keystore 40:0C:73 lapgo
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
          cp android/app/release.keystore android/app/upload-keystore.jks

      - name: Inject signing 40 from Secrets
        run: |
          sed -i '/MYAPP_RELEASE/d' android/gradle.properties || true
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties

      - name: Build AAB + APK
        run: |
          cd android
          chmod +x gradlew
          KS_PASS=${{ secrets.KEYSTONE_PASSWORD }} KS_ALIAS=${{ secrets.KEYSTONE_ALIAS }} ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload AAB+APK to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fungsui-v1-api36-${{ github.run_number }}
          name: FungSui-Go v1 API36 #${{ github.run_number }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
